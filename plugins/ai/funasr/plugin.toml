id = "org.voicestudio.funasr"
name = "FunASR 中文流式识别"
version = "1.0.0"
api_version = "1.0"
runtime = "python"
entrypoint = "plugin_impl:create_plugin"
description = "FunASR paraformer-zh-streaming 流式中文 ASR + silero-vad"
license = "Apache-2.0"

permissions = ["gpu"]

[[models]]
model_id = "paraformer-streaming"
display_name = "Paraformer-zh Streaming"
